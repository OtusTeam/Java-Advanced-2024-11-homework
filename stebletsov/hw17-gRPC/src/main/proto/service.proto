syntax = "proto3";

package ecommerce;

option java_multiple_files = true;
option java_package = "ru.otus.grpc";
option java_outer_classname = "ServiceProto";

import "google/protobuf/empty.proto";
import "user.proto";
import "product.proto";

message AddProductToCartRequest {
  int64 userId = 1;
  int64 productId = 2;
}

service UserProductService {
  rpc createUser(CreateUserRequest) returns (UserID);
  rpc changeUserEmail(ChangeEmailRequest) returns (google.protobuf.Empty);
  rpc changeUserName(ChangeUsernameRequest) returns (google.protobuf.Empty);
  rpc createProduct(CreateProductRequest) returns (ProductID);
  rpc addProductToCart(AddProductToCartRequest) returns (google.protobuf.Empty);
}
