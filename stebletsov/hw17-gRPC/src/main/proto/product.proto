syntax = "proto3";

package ecommerce;

option java_multiple_files = true;
option java_package = "ru.otus.grpc";
option java_outer_classname = "ProductProto";

message Product {
  int64 id = 1;
  string name = 2;
}

message ProductID {
  int64 value = 1;
}

message CreateProductRequest {
  string name = 1;
}
