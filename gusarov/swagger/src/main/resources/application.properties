spring.application.name=task16
server.port=8096
spring.datasource.url=jdbc:h2:mem:task16db
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=password
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
logging.file.path=logs

springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.path=/api-docs-ui
springdoc.swagger-ui.config-url=http://127.0.0.1:8096/api-docs/swagger-config
springdoc.swagger-ui.url=http://127.0.0.1:8096/api-docs



