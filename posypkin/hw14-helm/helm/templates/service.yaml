kind: Service
apiVersion: v1
metadata:
  name: {{ .Values.appname }}
spec:
  selector:
    app: {{ .Values.appname }}
  ports:
    - protocol: {{ .Values.protocol }}
      port: {{ .Values.port }}
      {{- if hasKey .Values "nodePort" }}
      nodePort: {{ .Values.nodePort }}
      {{- end }}
      {{- if hasKey .Values "targetPort" }}
      targetPort: {{ .Values.targetPort }}
      {{- end }}
  type: {{ .Values.type }}