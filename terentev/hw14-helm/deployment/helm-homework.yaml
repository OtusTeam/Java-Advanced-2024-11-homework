kind: Service
apiVersion: v1
metadata:
  name: helm-kubernetes-homework
spec:
  selector:
    app: helm-kubernetes-homework
    tier: hw14-helm
  ports:
  - protocol: TCP
    port: 8080
  type: ClusterIP
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: helm-kubernetes-homework
spec:
  selector:
      matchLabels:
        app: helm-kubernetes-homework
        tier: hw14-helm
  replicas: 1
  template:
    metadata:
      labels:
        app: helm-kubernetes-homework
        tier: hw14-helm
    spec:
      containers:
        - name: helm-kubernetes-homework
          image: salterentev/otushelm-homework:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8080

